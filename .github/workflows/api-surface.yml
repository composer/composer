name: "API Surface Check"

# Analyzes the PR with a read-only token and uploads the comment text as an
# artifact; api-surface-comment.yml posts it from workflow_run.

on:
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: api-surface-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 'Analyze API surface'
    runs-on: ubuntu-latest
    steps:
      - uses: composer/api-surface-check@4a61b8a7bedd319bf9d3e5215dc3708c5a29fc0b # main
        with:
          install-dependencies: true
          # paths: src/**/*.php
          # source-roots: src
          # include-internal: false
          # show-removed: true
          # show-modified: true
